roi:
  enabled: true
  bbox:
    x: 500
    y: 300
    width: 800
    height: 500

scoring:
  # Running blood is slow compared with instruments, so keep this low and rely on the
  # appearance gates below to reject fast, non-red motion.
  magnitude_threshold: 0.5
  blood_appearance:
    color:
      enabled: true
      # OpenCV HSV hue is 0-179 and red wraps, so pixels within this margin of 0 or 180 pass.
      hue_margin: 12.0
      minimum_saturation: 90.0
      # Darker red than perfused tissue is the main separator; raise to admit brighter blood.
      maximum_value: 150.0
      opening_kernel_size: 3
    darkening:
      enabled: true
      # Minimum HSV value drop versus the previous frame for a pixel to count as newly covered by blood.
      minimum_value_drop: 2.0
      blur_kernel_size: 5
  gravity:
    enabled: true
    vector:
      x: 0.0
      y: 1.0
    minimum_alignment: 0.5

visualization:
  flow_magnitude_clip: 15.0
  overlay_alpha: 0.45
  output_codec: mp4v
